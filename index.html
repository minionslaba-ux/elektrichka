<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Последняя электричка</title>
<meta name="description" content="Машинист пригородной электрички: останови состав точно у платформы.">
<meta name="theme-color" content="#0b0f22">
<link rel="preload" href="lib/three/three.min.js" as="script">
<style>
:root{--ink:#f3eee4;--dim:#a9adc4;--warm:#ffbe6b;--glass:rgba(10,13,30,.62);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f22;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 55%,rgba(4,5,14,.62) 100%)}
/* первый экран — чистый CSS, виден до движка */
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;transition:opacity .8s;
  background:radial-gradient(ellipse 120% 50% at 60% 78%,#7a3f3a 0%,#2a2546 45%,transparent 75%),linear-gradient(#060918,#151b3a 60%,#1c1d38)}
#boot h1{margin:0;font-weight:800;font-size:clamp(30px,7vw,58px);letter-spacing:.01em;text-shadow:0 0 30px rgba(255,170,90,.35)}
#boot .bar{width:120px;height:2px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:2px}
#boot .bar i{display:block;height:100%;width:40%;background:var(--warm);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#boot.hide{opacity:0;pointer-events:none}
.g{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ui{opacity:0;transition:opacity .6s}body.play #ui{opacity:1}
#money{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top));text-align:right;z-index:5;pointer-events:none;border-radius:12px;padding:7px 12px}
#money b{font-size:21px;color:var(--warm);font-variant-numeric:tabular-nums}#money small{display:block;color:var(--dim);font-size:12px}
/* табличка станции — как настоящая: синяя с белой рамкой */
#sign{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:5;pointer-events:none;text-align:center}
#sign .pl{background:#1b3f8f;border:2px solid #e9eef8;border-radius:4px;padding:5px 16px;font-weight:800;font-size:17px;letter-spacing:.02em;box-shadow:0 4px 18px rgba(0,0,0,.4);white-space:nowrap}
#sign .d{margin-top:5px;font-size:13px;color:var(--ink);opacity:.85;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000}
#gauge{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%);width:min(300px,64vw);height:26px;z-index:5;opacity:0;transition:opacity .3s;pointer-events:none}
#gauge.on{opacity:1}
#gauge .rail{position:absolute;left:0;right:0;top:12px;height:2px;background:rgba(255,255,255,.25)}
#gauge .zone{position:absolute;left:50%;top:5px;width:8%;height:16px;transform:translateX(-50%);background:rgba(120,230,150,.22);border:1px solid #7be39a;border-radius:3px}
#gauge .stop{position:absolute;left:50%;top:0;width:2px;height:26px;transform:translateX(-50%);background:#ff5b4f;box-shadow:0 0 8px #ff5b4f}
#gauge .me{position:absolute;top:6px;width:14px;height:14px;margin-left:-14px;border-radius:3px 7px 7px 3px;background:var(--warm);box-shadow:0 0 10px var(--warm)}
#speed{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;text-shadow:0 2px 12px #000}
#speed b{display:block;font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}#speed small{color:var(--dim);font-size:12px;letter-spacing:.12em}
#msg{position:fixed;left:0;right:0;top:32%;text-align:center;font-size:clamp(30px,7.5vw,54px);font-weight:800;letter-spacing:.01em;pointer-events:none;z-index:6;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;text-shadow:0 0 26px currentColor,0 3px 16px #000}
#msg.on{opacity:1;transform:none}#msg small{display:block;font-size:16px;font-weight:500;color:var(--ink);margin-top:8px;text-shadow:0 2px 8px #000}
#hint{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(420px,calc(100vw - 32px));text-align:center;pointer-events:none;z-index:6;opacity:0;transition:opacity .4s}
#hint.on{opacity:1}#hint span{display:inline-block;border-radius:12px;padding:9px 14px;font-size:15px;line-height:1.35}
.btn{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));width:min(132px,34vw);height:104px;border-radius:24px;z-index:7;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;letter-spacing:.08em;touch-action:none;cursor:pointer;transition:transform .08s,box-shadow .15s}
.btn i{width:34px;height:34px;display:block}
#go{left:16px;box-shadow:inset 0 0 0 2px rgba(110,220,140,.55)}#go i{background:#6fdc8c;clip-path:polygon(50% 8%,92% 88%,8% 88%)}
#br{right:16px;box-shadow:inset 0 0 0 2px rgba(255,100,90,.6)}#br i{background:#ff6b5e;border-radius:5px;width:28px;height:28px}
#go.dn{transform:scale(.96);box-shadow:inset 0 0 0 2px #6fdc8c,0 0 28px rgba(110,220,140,.45);background:rgba(30,70,45,.75)}
#br.dn{transform:scale(.96);box-shadow:inset 0 0 0 2px #ff6b5e,0 0 28px rgba(255,100,90,.45);background:rgba(80,25,25,.75)}
@media (max-aspect-ratio:1/1){#sign{top:calc(64px + env(safe-area-inset-top))}#gauge{top:calc(128px + env(safe-area-inset-top))}#money{top:calc(10px + env(safe-area-inset-top))}}
#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,18,.6);z-index:10;padding:16px}
#end.on{display:flex}
#end .card{width:min(400px,100%);border-radius:18px;padding:22px;text-align:center}
#end h2{margin:0;font-size:22px}#end .sub{color:var(--dim);font-size:13px;margin-top:2px}
#end .stars{font-size:38px;color:var(--warm);letter-spacing:6px;margin:8px 0;text-shadow:0 0 18px rgba(255,190,107,.5)}
#end table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:14px}#end td{padding:6px 0;border-bottom:1px solid var(--line)}#end td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#end button{width:100%;padding:15px;border-radius:14px;border:0;background:var(--warm);color:#2a1806;font:800 17px system-ui,sans-serif;cursor:pointer}
#menu{position:fixed;inset:0;z-index:8;display:none;pointer-events:none}
body.menu #menu{display:block}body.menu #ui{display:none}
#menu .top{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top));pointer-events:none}
#menu h1{margin:0;font-size:clamp(26px,5.5vw,44px);font-weight:800;text-shadow:0 2px 20px rgba(0,0,0,.6),0 0 30px rgba(255,170,90,.25)}
#menu .best{color:var(--dim);font-size:14px;margin-top:4px;text-shadow:0 1px 6px #000}
#menu .panel{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));border-radius:20px;padding:14px;pointer-events:auto}
#menu .lab{font-size:12px;letter-spacing:.12em;color:var(--dim);margin:2px 2px 8px}
#menu .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
#menu .row.two{grid-template-columns:1fr 1fr}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:12px;padding:8px 4px 7px;font:600 13px system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.chip i{display:block;width:100%;max-width:64px;height:30px;border-radius:7px}
.chip.on{border-color:var(--warm);box-shadow:0 0 0 1px var(--warm),0 0 18px rgba(255,190,107,.25);background:rgba(255,190,107,.08)}
.t-night{background:radial-gradient(circle at 75% 30%,#f2f0e6 0 3px,transparent 4px),linear-gradient(#05081a,#1d2550 70%,#c8664a)}
.t-dawn{background:linear-gradient(#16204a,#6a5a8c 60%,#e88e86)}
.t-day{background:radial-gradient(circle at 70% 35%,#fff 0 4px,transparent 5px),linear-gradient(#3f70b4,#a8c0dc 75%,#e6edf5)}
.t-sunset{background:radial-gradient(circle at 50% 85%,#ffe0a8 0 5px,transparent 6px),linear-gradient(#24346a,#a06a8a 55%,#ff8448)}
#play{width:100%;padding:16px;border:0;border-radius:14px;background:var(--warm);color:#2a1806;font:800 19px system-ui,sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:0 6px 24px rgba(255,170,80,.3)}
#view{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top));z-index:6;border-radius:12px;padding:8px 12px;color:var(--ink);font:700 13px system-ui,sans-serif;cursor:pointer}
body.cab #speed{bottom:auto;top:calc(120px + env(safe-area-inset-top));left:auto;right:16px;transform:none}body.cab #speed b{font-size:34px}
body.cab #hint{bottom:auto;top:calc(120px + env(safe-area-inset-top))}
@media (max-aspect-ratio:1/1){body.cab #hint{top:calc(170px + env(safe-area-inset-top))}body.cab #speed{top:calc(236px + env(safe-area-inset-top))}}
#end .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}#end .btns button.alt{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}
#err{position:fixed;left:16px;right:16px;bottom:16px;z-index:30;display:none;background:#5a1d24;padding:12px;border-radius:12px}
</style>
</head>
<body>
<div id="vig"></div>
<div id="boot"><h1>Последняя электричка</h1><div class="bar"><i></i></div></div>
<div id="ui">
  <div id="money" class="g"><b id="rub">0 ₽</b><small id="pax">пассажиров: 0</small></div>
  <div id="sign"><div class="pl" id="stname">—</div><div class="d" id="stdist"></div></div>
  <div id="gauge"><div class="rail"></div><div class="zone"></div><div class="stop"></div><div class="me" id="gme"></div></div>
  <div id="speed"><b id="kmh">0</b><small>КМ/Ч</small></div>
  <div class="g" id="view">ВИД: СБОКУ</div>
  <div class="btn g" id="go"><i></i>ХОД</div>
  <div class="btn g" id="br"><i></i>ТОРМОЗ</div>
</div>
<div id="menu">
  <div class="top"><h1>Последняя электричка</h1><div class="best" id="mbest"></div></div>
  <div class="panel g">
    <div class="lab">ВРЕМЯ СУТОК</div>
    <div class="row" id="tods">
      <button class="chip" data-t="night"><i class="t-night"></i>Ночь</button>
      <button class="chip" data-t="dawn"><i class="t-dawn"></i>Рассвет</button>
      <button class="chip" data-t="day"><i class="t-day"></i>День</button>
      <button class="chip" data-t="sunset"><i class="t-sunset"></i>Закат</button>
    </div>
    <div class="lab">КАМЕРА</div>
    <div class="row two" id="views"><button class="chip" data-v="side">Сбоку</button><button class="chip" data-v="cab">Из кабины</button></div>
    <button id="play">ЕХАТЬ</button>
  </div>
</div>
<div id="msg"></div>
<div id="hint"></div>
<div id="end"><div class="card g"><h2>Рейс окончен</h2><div class="sub" id="esub"></div><div class="stars" id="estars"></div><table id="etab"></table><div class="btns"><button id="tomenu" class="alt">Меню</button><button id="again">Ещё рейс</button></div></div></div>
<div id="err"></div>

<script>
/* Площадка: web / pikabu / vk / ok / tg / max / gamepush / rt. В прототипе работает только web. */
const PLATFORM = (new URLSearchParams(location.search).get('p') || window.EL_PLATFORM || 'web');
const T0 = performance.now();
window.addEventListener('error', (e) => { const b = document.getElementById('err'); b.style.display = 'block'; b.textContent = 'Ошибка: ' + (e.message || e); });
</script>
<script src="lib/three/three.min.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- линия ---------- */
const STATIONS = ['Сосновая Роща', 'Дачная', 'Платформа 47 км', 'Берёзовка', 'Рыбачья', 'Старые Дубки'];
const ST_POS = [0]; for (let i = 1; i < STATIONS.length; i++) ST_POS.push(ST_POS[i - 1] + 420 + Math.round(Math.random() * 160));
const LINE_LEN = ST_POS[ST_POS.length - 1] + 400;
const CAR_LEN = 20, CARS = 4, PLAT_LEN = 100, FARE = 45;

/* ---------- уровень устройства ---------- */
const UA = navigator.userAgent, mobile = /Android|iPhone|iPad|Mobile/i.test(UA);
const lowEnd = (navigator.deviceMemory && navigator.deviceMemory <= 4) || /Mali-[GT][0-9]{1,2}\b|Adreno \(TM\) [3-5]/i.test(UA);
let tier = lowEnd ? 0 : mobile ? 1 : 2;
if (/[?&]q=([012])/.test(location.search)) tier = +RegExp.$1;

const renderer = new THREE.WebGLRenderer({ antialias: tier > 0, powerPreference: 'high-performance' });
let dprMax = Math.min(window.devicePixelRatio || 1, tier === 0 ? 1.25 : tier === 1 ? 1.75 : 2), dpr = dprMax;
renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

/* ---------- время суток: всё освещение и цвета берутся отсюда ---------- */
const PRESETS = {
  night: { name: 'Ночь', fog: '#33375a', dens: 0.0088, zen: '#05081a', mid: '#182044', glow: '#c8664a', glow2: '#e8a070', glowK: 0.85,
    amb: [0.30, 0.35, 0.56], bounce: [0.10, 0.09, 0.13], sun: [0.26, 0.30, 0.42], sunDir: [0.25, 0.75, 0.6], lampK: 1, stars: 1, moon: 1, sunDisc: 0,
    win: '#ffd38c', winTop: '#fff0c8', head: '#fff4d6', houseWin: 0.75, hemi: ['#6676a8', '#1a1822', 1.0], dirL: ['#a9bbe6', 0.55], vig: 0.62, bloom: 0.72, tree: '#16302a' },
  dawn: { name: 'Рассвет', fog: '#6b6a8c', dens: 0.0072, zen: '#16204a', mid: '#4f5288', glow: '#e88e86', glow2: '#ffd2a8', glowK: 0.9,
    amb: [0.40, 0.42, 0.60], bounce: [0.15, 0.12, 0.14], sun: [0.55, 0.42, 0.42], sunDir: [0.55, 0.3, 0.6], lampK: 0.7, stars: 0.35, moon: 0, sunDisc: 0,
    win: '#ffd38c', winTop: '#fff0c8', head: '#fff4d6', houseWin: 0.6, hemi: ['#a09ac0', '#2a2530', 1.0], dirL: ['#ffc4a8', 0.7], vig: 0.5, bloom: 0.8, tree: '#183429' },
  day: { name: 'День', fog: '#bcc7d6', dens: 0.0046, zen: '#3f70b4', mid: '#94b2d6', glow: '#e8eef6', glow2: '#ffffff', glowK: 0.3,
    amb: [0.60, 0.66, 0.80], bounce: [0.26, 0.26, 0.28], sun: [0.55, 0.52, 0.45], sunDir: [0.4, 0.7, 0.6], lampK: 0, stars: 0, moon: 0, sunDisc: 0,
    win: '#7f95a8', winTop: '#b2c4d2', head: '#c9ccd2', houseWin: 0, hemi: ['#d4def0', '#6a6a72', 1.1], dirL: ['#fff4e0', 0.9], vig: 0.3, bloom: 0, tree: '#21483a' },
  sunset: { name: 'Закат', fog: '#8a6a7a', dens: 0.006, zen: '#24346a', mid: '#7a6a9c', glow: '#ff8448', glow2: '#ffd08a', glowK: 1,
    amb: [0.44, 0.42, 0.60], bounce: [0.20, 0.14, 0.12], sun: [0.95, 0.55, 0.32], sunDir: [0.7, 0.3, 0.4], lampK: 0.6, stars: 0, moon: 0, sunDisc: 1,
    win: '#ffcf8a', winTop: '#ffe8c0', head: '#fff4d6', houseWin: 0.5, hemi: ['#c4a0b0', '#40303a', 1.0], dirL: ['#ffb27a', 1.0], vig: 0.45, bloom: 0.85, tree: '#1a3529' },
};
let TOD = 'night'; try { if (PRESETS[localStorage.getItem('el_tod')]) TOD = localStorage.getItem('el_tod'); } catch (e) {}
let P = PRESETS[TOD], FOG = new THREE.Color(P.fog), AMB, BOUNCE, MOON, MOON_DIR = new THREE.Vector3();
function usePreset(name) {
  TOD = name; P = PRESETS[name]; FOG = new THREE.Color(P.fog); AMB = P.amb; BOUNCE = P.bounce; MOON = P.sun; MOON_DIR.set(...P.sunDir).normalize();
  scene.fog.color.copy(FOG); scene.fog.density = P.dens; scene.background = FOG;
  document.getElementById('vig').style.opacity = P.vig / 0.62;
}
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG, P.dens);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.4, 560);
const W = new THREE.Group(); scene.add(W); // всё, что пересобирается при смене времени суток

/* запечённый свет: небо + солнце/луна + фонари считаются один раз в цвет вершин */
const LAMPS = []; // {x,y,z,R,I,r,g,b}
const addLamp = (x, y, z, R, I, col) => { if (P.lampK <= 0) return; const c = new THREE.Color(col); LAMPS.push({ x, y, z, R, I: I * P.lampK, r: c.r, g: c.g, b: c.b }); };
const lampsNear = (x0, x1) => LAMPS.filter((l) => l.x > x0 - l.R && l.x < x1 + l.R);
const soft = (v) => (v < 0.82 ? v : 0.82 + 0.18 * (1 - Math.exp(-(v - 0.82) * 4)));

const TC = new THREE.Color();
class Builder {
  constructor(lamps, keepN) { this.lamps = lamps || []; this.p = []; this.c = []; this.n = keepN ? [] : null; }
  // col: цвет, или функция (cx,cy,cz,nx,ny,nz) => THREE.Color по центру грани
  // o.emit — светится сам (без освещения), o.flat=false — гладкие нормали, o.jit — разброс яркости граней,
  // o.spec — блик фонарей сильнее (рельсы), o.ao = [y0, h] — темнее у основания
  add(geo, m, col, o = {}) {
    let g;
    if (o.flat === false) { g = geo.clone(); if (m) g.applyMatrix4(m); g.computeVertexNormals(); if (g.index) g = g.toNonIndexed(); }
    else { g = geo.index ? geo.toNonIndexed() : geo.clone(); if (m) g.applyMatrix4(m); g.computeVertexNormals(); }
    const P = g.attributes.position.array, N = g.attributes.normal.array, fixed = typeof col !== 'function' ? new THREE.Color(col) : null;
    for (let i = 0; i < P.length; i += 9) {
      const cx = (P[i] + P[i + 3] + P[i + 6]) / 3, cy = (P[i + 1] + P[i + 4] + P[i + 7]) / 3, cz = (P[i + 2] + P[i + 5] + P[i + 8]) / 3;
      const base = fixed || col(cx, cy, cz, N[i], N[i + 1], N[i + 2]);
      const k = o.jit ? 1 + (Math.random() - 0.5) * o.jit : 1;
      const ar = base.r * k, ag = base.g * k, ab = base.b * k;
      for (let v = 0; v < 3; v++) {
        const j = i + v * 3, px = P[j], py = P[j + 1], pz = P[j + 2], nx = N[j], ny = N[j + 1], nz = N[j + 2];
        this.p.push(px, py, pz); if (this.n) this.n.push(nx, ny, nz);
        if (o.emit || this.n) { this.c.push(ar, ag, ab); continue; }
        const h = 0.5 + 0.5 * ny;
        let r = AMB[0] * h + BOUNCE[0] * (1 - h), gg = AMB[1] * h + BOUNCE[1] * (1 - h), b = AMB[2] * h + BOUNCE[2] * (1 - h);
        const md = Math.max(0, nx * MOON_DIR.x + ny * MOON_DIR.y + nz * MOON_DIR.z); r += MOON[0] * md; gg += MOON[1] * md; b += MOON[2] * md;
        for (const L of this.lamps) {
          const dx = L.x - px, dy = L.y - py, dz = L.z - pz, d2 = dx * dx + dy * dy + dz * dz;
          if (d2 > L.R * L.R) continue;
          const d = Math.sqrt(d2) + 1e-3, fall = (1 - d / L.R) ** 2 * L.I / (1 + d2 * 0.06);
          const f = fall * Math.max(0.12, (dx * nx + dy * ny + dz * nz) / d) * (o.spec || 1);
          r += L.r * f; gg += L.g * f; b += L.b * f;
        }
        const ao = o.ao ? 0.45 + 0.55 * clamp((py - o.ao[0]) / o.ao[1], 0, 1) : 1;
        this.c.push(soft(ar * r * ao), soft(ag * gg * ao), soft(ab * b * ao));
      }
    }
    g.dispose();
  }
  build() {
    const g = new THREE.BufferGeometry();

        composer = new THREE.EffectComposer(renderer, rt); composer.setPixelRatio(dpr); composer.setSize(innerWidth, innerHeight);
        composer.addPass(new THREE.RenderPass(scene, camera));
        bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.75, 0.55, P.bloom || 0.8);
        composer.addPass(bloom);
      } catch (e) { composer = null; }
      return;
    }
    const s = document.createElement('script'); s.src = 'lib/three/post/' + files[k] + '.js'; s.onload = () => next(k + 1); s.onerror = () => {}; document.head.appendChild(s);
  };
  next(0);
}

/* ---------- рейс ---------- */
const game = { x: ST_POS[0], v: 0, target: 1, state: 'boot', money: 0, pax: 0, res: [], doorT: 0, msgT: 0, startT: 0, throttle: false, brake: false };
const ACC = 1.15, BRK = 1.9, DRAG = 0.035, VMAX = 22.2;
function showMsg(t, sub, col, ms = 1800) { const m = $('msg'); m.innerHTML = t + (sub ? '<small>' + sub + '</small>' : ''); m.style.color = col || '#fff'; m.classList.add('on'); game.msgT = ms; }
function hint(t, ms) { const h = $('hint'); h.innerHTML = '<span class="g">' + t + '</span>'; h.classList.add('on'); clearTimeout(hint.t); if (ms) hint.t = setTimeout(() => h.classList.remove('on'), ms); }
function hideHint() { $('hint').classList.remove('on'); }
function arrive(err) {
  const a = Math.abs(err), wait = crowd.length;
  let title, sub, col, board, tip = 0, grade;
  if (a <= 1.5) { title = 'Идеально!'; grade = 3; board = wait; tip = 50; col = '#8dffaf'; }
  else if (a <= 4) { title = 'Отлично'; grade = 2.5; board = wait; tip = 20; col = '#c6ff9e'; }
  else if (a <= 10) { title = 'Хорошо'; grade = 2; board = wait; col = '#ffe9a0'; }
  else if (err > 0) { title = 'Проскочил!'; grade = 1; board = Math.ceil(wait * 0.6); col = '#ff9a7a'; sub = 'пассажиры ворчат, не все успели'; }
  else { title = 'Недотянул'; grade = 1.2; board = wait; col = '#ffc27a'; sub = 'пассажиры бегут по снегу'; }
  const fare = board * FARE;
  game.money += fare + tip; game.pax += board; game.res.push({ st: STATIONS[game.target], err, grade, board, fare: fare + tip });
  showMsg(title, (sub ? sub + '<br>' : '') + '+' + (fare + tip) + ' ₽' + (tip ? ' · чаевые ' + tip : '') + ' · ' + (err >= 0 ? '+' : '−') + a.toFixed(1) + ' м', col, 2600);
  const doors = []; for (let c = 0; c < CARS; c++) { const cx = game.x - c * CAR_LEN - CAR_LEN / 2; doors.push(cx - CAR_LEN / 2 + 3.75, cx + CAR_LEN / 2 - 3.75); }
  crowd.forEach((p, k) => { if (k < board) { p.st = 1; p.tx = doors.reduce((b, d) => (Math.abs(d - p.x) < Math.abs(b - p.x) ? d : b), doors[0]); } });
  game.state = 'doors'; game.doorT = 4.2; game.v = 0;
}
function departNext() {
  if (game.target >= STATIONS.length - 1) return endRun();
  game.target++; spawnCrowd(game.target); game.state = 'drive';
  showMsg('Двери закрываются', 'следующая — ' + STATIONS[game.target], '#fff', 1600);
}
function endRun() {
  game.state = 'end'; $('gauge').classList.remove('on');
  const avg = game.res.reduce((s, r) => s + r.grade, 0) / Math.max(1, game.res.length), stars = avg >= 2.6 ? 3 : avg >= 1.8 ? 2 : 1;
  $('estars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  const t = Math.round((performance.now() - game.startT) / 1000);
  $('esub').textContent = STATIONS[0] + ' → ' + STATIONS[STATIONS.length - 1] + ' · ' + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  $('etab').innerHTML = game.res.map((r) => `<tr><td>${r.st}</td><td>${r.err >= 0 ? '+' : '−'}${Math.abs(r.err).toFixed(1)} м · ${r.fare} ₽</td></tr>`).join('') +
    `<tr><td><b>Выручка</b></td><td><b>${game.money} ₽</b></td></tr><tr><td>Пассажиров</td><td>${game.pax}</td></tr>`;
  try { const best = +localStorage.getItem('el_best') || 0; if (game.money > best) localStorage.setItem('el_best', game.money); } catch (e) {}
  setTimeout(() => $('end').classList.add('on'), 1400);
}
function resetRun() {
  game.x = ST_POS[0]; game.v = 0; game.target = 1; game.money = 0; game.pax = 0; game.res = []; game.state = 'drive'; game.startT = performance.now();
  spawnCrowd(1); $('end').classList.remove('on'); showMsg('Поехали!', 'следующая — ' + STATIONS[1], '#fff', 1500);
}

/* ---------- управление ---------- */
function bindHold(el, key) {
  const on = (e) => { e.preventDefault(); game[key] = true; el.classList.add('dn'); };
  const off = (e) => { e.preventDefault(); game[key] = false; el.classList.remove('dn'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindHold($('go'), 'throttle'); bindHold($('br'), 'brake');
const KEYS = { ArrowUp: 'throttle', KeyW: 'throttle', Space: 'throttle', ArrowDown: 'brake', KeyS: 'brake', ShiftLeft: 'brake' };
addEventListener('keydown', (e) => { if (e.code === 'KeyC') setView(VIEW === 'cab' ? 'side' : 'cab'); const k = KEYS[e.code]; if (k) { game[k] = true; $(k === 'throttle' ? 'go' : 'br').classList.add('dn'); e.preventDefault(); } });
addEventListener('keyup', (e) => { const k = KEYS[e.code]; if (k) { game[k] = false; $(k === 'throttle' ? 'go' : 'br').classList.remove('dn'); } });
addEventListener('blur', () => { game.throttle = game.brake = false; });

/* ---------- облегчение по fps: свечение → разрешение → снег ---------- */
const perf = { frames: 0, acc: 0, level: 0 };
function adapt(dt) {
  perf.frames++; perf.acc += dt; if (perf.acc < 2) return;
  const fps = perf.frames / perf.acc; perf.frames = 0; perf.acc = 0; window.EL_FPS = fps;
  if (fps < 45 && composer) { composer = null; perf.level++; }
  else if (fps < 40 && dpr > 0.75) { dpr = Math.max(0.75, dpr - 0.25); renderer.setPixelRatio(dpr); perf.level++; }
  else if (fps < 30 && snow.visible) { snow.visible = false; perf.level++; }
  else if (fps > 57 && dpr < dprMax) { dpr = Math.min(dprMax, dpr + 0.25); renderer.setPixelRatio(dpr); }
}

/* ---------- камера ---------- */
let VIEW = 'side'; try { if (localStorage.getItem('el_view') === 'cab') VIEW = 'cab'; } catch (e) {}
const inCab = () => VIEW === 'cab' && game.state !== 'menu';
function fitCam() {
  camera.aspect = innerWidth / innerHeight; const port = camera.aspect < 1;
  if (inCab()) { camera.fov = port ? 84 : 62; camera.near = 0.05; } else { camera.fov = port ? 70 : 50; camera.near = 0.4; }
  camera.updateProjectionMatrix(); if (composer) composer.setSize(innerWidth, innerHeight);
  if (CAB.group) { CAB.group.visible = inCab(); CAB.ext.visible = !inCab(); }
  $('view').textContent = VIEW === 'cab' ? 'ВИД: КАБИНА' : 'ВИД: СБОКУ'; document.body.classList.toggle('cab', inCab());
}
function setView(v) { VIEW = v; try { localStorage.setItem('el_view', v); } catch (e) {} fitCam(); snapCam(); document.querySelectorAll('#views .chip').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); }
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitCam(); });
fitCam();
const camPos = new THREE.Vector3(), look = new THREE.Vector3(), lookS = new THREE.Vector3();
function snapCam() { camTarget(); camera.position.copy(camPos); lookS.copy(look); }
function camTarget() {
  const k = game.v / VMAX, port = camera.aspect < 1;
  if (game.state === 'menu') { const a = 0.95 + 0.5 * Math.sin(performance.now() * 0.00013), cx = game.x - 22; camPos.set(cx + Math.cos(a) * 27, 4.2, Math.sin(a) * 27); look.set(cx + 6, 2.0, 0); return; }
  if (inCab()) { camPos.set(game.x - 0.12, 2.88, -0.6); look.set(game.x + 60, port ? -1.5 : 0.6, -0.55); return; }
  if (port) { camPos.set(game.x - 30 - k * 5, 7.5, 15 - k); look.set(game.x + 4 + k * 14, 0.8, 0.5); }
  else { camPos.set(game.x - 25 - k * 6, 3.3 + k * 0.4, 9.2 - k * 0.6); look.set(game.x + 14 + k * 16, 2.2, -1.5); }
}

/* ---------- кадр ---------- */
let last = performance.now(), firstFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (firstFrame) buildOne(game.x);
  if (game.state === 'drive') {
    let a = -DRAG - game.v * 0.004;
    if (game.brake) a -= BRK; else if (game.throttle) a += ACC * (1 - game.v / (VMAX * 1.05));
    game.v = clamp(game.v + a * dt, 0, VMAX); game.x += game.v * dt;
    const err = game.x - ST_POS[game.target];
    if (game.v === 0 && err > -60 && err < 60 && !game.throttle) arrive(err);
    else if (err > 60) {
      game.res.push({ st: STATIONS[game.target], err, grade: 0, board: 0, fare: 0 });
      showMsg('Проехал станцию!', 'пассажиры остались на морозе', '#ff7a7a', 2200);
      if (game.target >= STATIONS.length - 1) endRun(); else { game.target++; spawnCrowd(game.target); }
    }
    if (game.x > LINE_LEN - 30) { game.x = LINE_LEN - 30; game.v = 0; }
  } else if (game.state === 'doors') { game.doorT -= dt; if (game.doorT <= 0) departNext(); }
  // интерфейс
  $('kmh').textContent = Math.round(game.v * 3.6);
  $('rub').textContent = game.money + ' ₽'; $('pax').textContent = 'пассажиров: ' + game.pax;
  const dist = ST_POS[game.target] - game.x;
  $('stname').textContent = game.state === 'end' ? 'Конечная' : STATIONS[game.target];
  $('stdist').textContent = game.state === 'drive' ? (dist > 0 ? 'до знака ' + Math.round(dist) + ' м' : 'знак позади: ' + Math.round(-dist) + ' м') : game.state === 'doors' ? 'посадка…' : '';
  const gEl = $('gauge'); if (game.state === 'drive' && dist < 160 && dist > -60) { gEl.classList.add('on'); $('gme').style.left = clamp(50 - dist / 160 * 50, 0, 100) + '%'; } else gEl.classList.remove('on');
  if (game.msgT > 0) { game.msgT -= dt * 1000; if (game.msgT <= 0) $('msg').classList.remove('on'); }
  // мир
  const k = game.v / VMAX;
  train.position.x = game.x; train.position.y = Math.sin(now * 0.021) * 0.01 * k; train.rotation.x = Math.sin(now * 0.013) * 0.002 * k;
  let near = 0; for (const sx of ST_POS) { const d = game.x - sx; if (d > -10 && d < PLAT_LEN + CAR_LEN * CARS) near = 1; }
  stL.intensity += ((near ? 0.55 : 0) - stL.intensity) * Math.min(1, dt * 2);
  drawCrowd(dt, now);
  for (const c of chunks) c.visible = c.userData.x0 < game.x + 460 && c.userData.x0 + CHUNK > game.x - 240;
  stObjs.forEach((g, i) => { if (g) g.visible = Math.abs(ST_POS[i] - game.x) < 600; });
  // снег летит навстречу
  const p = snowGeo.attributes.position.array, wind = 1.5 + game.v * 0.9;
  for (let i = 0; i < SNOW_N; i++) {
    let y = p[i * 3 + 1] - dt * (1.8 + (i % 7) * 0.15), x = p[i * 3] - dt * wind;
    if (y < -1) y += 25; if (x < -SB) x += 2 * SB;
    p[i * 3 + 1] = y; p[i * 3] = x;
  }
  snowGeo.attributes.position.needsUpdate = true; snow.position.set(camera.position.x + 20, 0, 0);
  camTarget();
  if (inCab()) {
    camera.position.copy(camPos); camera.position.y += train.position.y + Math.sin(now * 0.017) * 0.006 * k; lookS.copy(look); camera.lookAt(lookS);
    const lv = game.throttle ? -0.55 : 0, bv = game.brake ? -1.0 : 0;
    CAB.lever.rotation.z += (lv - CAB.lever.rotation.z) * Math.min(1, dt * 10); CAB.brake.rotation.y += (bv - CAB.brake.rotation.y) * Math.min(1, dt * 10);
    CAB.needle.rotation.x = 2.3 - clamp(game.v * 3.6 / 120, 0, 1) * 4.6;
  } else {
    const f = 1 - Math.exp(-dt * (game.state === 'menu' ? 1.2 : 2.5));
    camera.position.lerp(camPos, f); lookS.lerp(look, f);
    camera.position.y += (Math.random() - 0.5) * 0.025 * k;
    camera.lookAt(lookS);
  }
  skyG.position.copy(camera.position);
  if (composer && P.bloom > 0) composer.render(); else renderer.render(scene, camera);
  adapt(dt);
  if (!firstFrame) { firstFrame = performance.now(); window.EL_FIRST = Math.round(firstFrame - T0); afterFirst(); }
}

/* ---------- смена времени суток: пересобрать мир ---------- */
function rebuildWorld(name) {
  usePreset(name);
  LAMPS.length = 0; stationLights();
  W.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material !== bakedMat && o.material !== addMat) { if (o.material.map && o.material.map !== GLOW && o.material.map !== POOL) o.material.map.dispose(); o.material.dispose(); } });
  while (W.children.length) W.remove(W.children[0]);
  chunks.length = 0; stObjs.length = 0; built.clear(); stBuilt.clear();
  buildSky(); silhouettes(); buildTrain();
  hemi.color.set(P.hemi[0]); hemi.groundColor.set(P.hemi[1]); hemi.intensity = P.hemi[2];
  moonL.color.set(P.dirL[0]); moonL.intensity = P.dirL[1]; moonL.position.set(...P.sunDir);
  if (bloom) bloom.threshold = P.bloom || 0.8;
  for (let i = 0; i < 4; i++) buildOne(game.x);
  fitCam();
  try { localStorage.setItem('el_tod', name); } catch (e) {}
  document.querySelectorAll('#tods .chip').forEach((b) => b.classList.toggle('on', b.dataset.t === name));
}

/* ---------- меню ---------- */
function showMenu() {
  game.state = 'menu'; game.x = ST_POS[0]; game.v = 0; game.target = 1; spawnCrowd(1);
  document.body.classList.add('menu'); $('end').classList.remove('on'); hideHint(); $('msg').classList.remove('on');
  let best = 0; try { best = +localStorage.getItem('el_best') || 0; } catch (e) {}
  $('mbest').textContent = best ? 'Лучшая выручка за рейс: ' + best + ' ₽' : STATIONS[0] + ' → ' + STATIONS[STATIONS.length - 1];
  fitCam(); snapCam();
}
function startRun(first) {
  document.body.classList.remove('menu');
  game.x = ST_POS[0]; game.v = 0; game.target = 1; game.money = 0; game.pax = 0; game.res = []; game.state = 'drive'; game.startT = performance.now();
  spawnCrowd(1); $('end').classList.remove('on'); fitCam(); snapCam();
  showMsg(first ? 'Последняя электричка' : 'Поехали!', STATIONS[0] + ' → ' + STATIONS[STATIONS.length - 1], '#ffd59a', 1800);
  hint('Держи <b>ХОД</b> — поехали', 0);
  const wait = setInterval(() => { if (game.v > 3 || game.state !== 'drive') { clearInterval(wait); if (game.state === 'drive') hint(first ? 'Отпусти — поезд катится сам. У платформы держи <b>ТОРМОЗ</b> и встань головой у красного знака' : 'Останови голову поезда у красного знака', first ? 6000 : 3000); else hideHint(); } }, 200);
}
$('again').onclick = () => startRun(false);
$('tomenu').onclick = showMenu;
$('play').onclick = () => startRun(false);
$('view').onclick = () => setView(VIEW === 'cab' ? 'side' : 'cab');
document.querySelectorAll('#tods .chip').forEach((b) => (b.onclick = () => { if (b.dataset.t !== TOD) rebuildWorld(b.dataset.t); }));
document.querySelectorAll('#views .chip').forEach((b) => (b.onclick = () => setView(b.dataset.v)));

/* ---------- старт ---------- */
// до первого кадра — только то, что видно сразу: куски у первой станции и сама станция
rebuildWorld(TOD); setView(VIEW);
spawnCrowd(1);
snapCam();
requestAnimationFrame(frame);

function afterFirst() {
  $('boot').classList.add('hide'); document.body.classList.add('play');
  if (tier === 2) setTimeout(loadBloom, 400);
  let seen = false; try { seen = !!localStorage.getItem('el_seen'); localStorage.setItem('el_seen', '1'); } catch (e) {}
  if (seen) showMenu(); else setTimeout(() => startRun(true), 1200); // новичок едет сразу, без меню
}
window.EL = { game, renderer, scene, ST_POS, perf, get composer() { return composer; } };
</script>
</body>
</html>
