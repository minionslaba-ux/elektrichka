<!doctype html>
<html lang="ru">

<title>Бабуля на Марсе</title>

<style>

canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  background:radial-gradient(ellipse 60% 30% at 70% 72%,#9ec4e8 0%,rgba(158,196,232,.25) 30%,transparent 60%),linear-gradient(#1c1022,#5a2c34 55%,#b8603e 80%,#6e3426)}

#tr b{font-size:22px;color:var(--hot);display:inline-block}#tr small{display:block;color:var(--dim);font-size:12px}

#turbo .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}#turbo .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#fff)}

@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes bumpC{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
@keyframes shakeC{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 9px))}40%{transform:translateX(calc(-50% + 8px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}

@keyframes stripes{to{background-position:56px 0}}
@keyframes flash{0%{opacity:var(--fo,.7)}100%{opacity:0}}
@keyframes cardIn{0%{transform:translateY(60px) scale(.88);opacity:0}100%{transform:none;opacity:1}}
@keyframes warnIn{0%{transform:translateY(-120%) skewY(-3deg)}15%{transform:translateY(0) skewY(-3deg)}85%{transform:translateY(0) skewY(-3deg)}100%{transform:translateY(-120%) skewY(-3deg)}}

#intro b{display:block;font-size:clamp(24px,6vw,36px);font-weight:900;line-height:1.1;margin:2px 0}
#intro span{font-size:14px;font-weight:700}

  background:repeating-linear-gradient(45deg,#ffcf3a 0 20px,#ff8a3a 20px 40px);background-size:56px 100%;animation:warnIn 2.4s cubic-bezier(.7,0,.2,1) both,stripes .5s linear infinite;box-shadow:0 8px 30px rgba(0,0,0,.4)}

#end.on .card{animation:cardIn .5s cubic-bezier(.2,1.3,.4,1) both}

#end h2 .ch{display:inline-block;animation:letter .45s cubic-bezier(.2,1.5,.4,1) both;white-space:pre}
#turbo .bar.hot{animation:glowP .6s ease-in-out infinite}
.cf{position:fixed;top:0;width:9px;height:14px;z-index:11;pointer-events:none;border-radius:2px;animation:conf linear both}
#radio span .cur{display:inline-block;width:7px;height:13px;background:var(--cyan);margin-left:2px;vertical-align:-2px;animation:flash .6s steps(2) infinite}
#err{position:fixed;left:16px;right:16px;bottom:16px;z-index:30;display:none;background:#5a1d24;padding:12px;border-radius:12px}
</style>
</head>

<script>
/* Площадка: web / pikabu / vk / ok / tg / max / gamepush / rt. В прототипе — web. */
const PLATFORM = (new URLSearchParams(location.search).get('p') || window.EL_PLATFORM || 'web');

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- устройство и рендер ---------- */
const UA = navigator.userAgent, mobile = /Android|iPhone|iPad|Mobile/i.test(UA);

let dprMax = Math.min(window.devicePixelRatio || 1, tier === 0 ? 1.25 : tier === 1 ? 1.75 : 2), dpr = dprMax;
renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

/* ---------- палитра: марсианские сумерки с голубым закатом ---------- */
const FOG = new THREE.Color('#7a4a46');
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(FOG, 0.0062); scene.background = FOG;
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.3, 700);
const AMB = [0.42, 0.30, 0.34], BOUNCE = [0.18, 0.09, 0.07], SUN = [0.40, 0.48, 0.62];

const LAMPS = [];
const addLamp = (x, y, z, R, I, col) => { const c = new THREE.Color(col); LAMPS.push({ x, y, z, R, I, r: c.r, g: c.g, b: c.b }); };
const soft = (v) => (v < 0.82 ? v : 0.82 + 0.18 * (1 - Math.exp(-(v - 0.82) * 4)));
const TC = new THREE.Color(), C = (h) => new THREE.Color(h);

    else { g = geo.index ? geo.toNonIndexed() : geo.clone(); if (m) g.applyMatrix4(m); g.computeVertexNormals(); }
    const P = g.attributes.position.array, N = g.attributes.normal.array, fixed = typeof col !== 'function' ? new THREE.Color(col) : null;
    for (let i = 0; i < P.length; i += 9) {
      const cx = (P[i] + P[i + 3] + P[i + 6]) / 3, cy = (P[i + 1] + P[i + 4] + P[i + 7]) / 3, cz = (P[i + 2] + P[i + 5] + P[i + 8]) / 3;
      const VC = o.vcol && g.attributes.color, base = VC ? TC.setRGB(VC.getX(i / 3) * o.vk, VC.getY(i / 3) * o.vk, VC.getZ(i / 3) * o.vk) : fixed || col(cx, cy, cz, N[i], N[i + 1], N[i + 2]);
      const k = o.jit ? 1 + (Math.random() - 0.5) * o.jit : 1, ar = base.r * k, ag = base.g * k, ab = base.b * k;
      for (let v = 0; v < 3; v++) {
        const j = i + v * 3, px = P[j], py = P[j + 1], pz = P[j + 2], nx = N[j], ny = N[j + 1], nz = N[j + 2];
        this.p.push(px, py, pz); if (this.n) this.n.push(nx, ny, nz);
        if (o.emit || this.n) { this.c.push(ar, ag, ab); continue; }
        const h = 0.5 + 0.5 * ny;
        let r = AMB[0] * h + BOUNCE[0] * (1 - h), gg = AMB[1] * h + BOUNCE[1] * (1 - h), b = AMB[2] * h + BOUNCE[2] * (1 - h);
        const sd = Math.max(0, nx * SUN_DIR.x + ny * SUN_DIR.y + nz * SUN_DIR.z); r += SUN[0] * sd; gg += SUN[1] * sd; b += SUN[2] * sd;
        for (const L of this.lamps) {
          const dx = L.x - px, dy = L.y - py, dz = L.z - pz, d2 = dx * dx + dy * dy + dz * dz;
          if (d2 > L.R * L.R) continue;
          const d = Math.sqrt(d2) + 1e-3, f = (1 - d / L.R) ** 2 * L.I / (1 + d2 * 0.05) * Math.max(0.15, (dx * nx + dy * ny + dz * nz) / d);
          r += L.r * f; gg += L.g * f; b += L.b * f;
        }
        const ao = o.ao ? 0.5 + 0.5 * clamp((py - o.ao[0]) / o.ao[1], 0, 1) : 1;

  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));

}
const M4 = new THREE.Matrix4(), Qt = new THREE.Quaternion(), Sv = new THREE.Vector3(), Pv = new THREE.Vector3(), Eu = new THREE.Euler();
const mat = (x, y, z, sx = 1, sy = 1, sz = 1, ry = 0, rx = 0, rz = 0) => M4.compose(Pv.set(x, y, z), Qt.setFromEuler(Eu.set(rx, ry, rz)), Sv.set(sx, sy, sz)).clone();
/* процедурные фактуры (рисуются в браузере, ничего не скачивается) */
function noiseTex(size, period, paint) {
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), img = x.createImageData(size, size), d = img.data;

  document.querySelectorAll('.ord').forEach((b) => (b.onclick = () => { ORDER = b.dataset.o; try { localStorage.setItem('bm_order', ORDER); } catch (e) {} renderOrders(); }));
}
$('again').onclick = () => newRun(false);
const fmt = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

/* ---------- управление: левая/правая половина экрана ---------- */
const touches = new Map();
function updInput() { let l = false, r = false; for (const x of touches.values()) { if (x < innerWidth / 2) l = true; else r = true; } input.tl = l; input.tr = r; }
addEventListener('pointerdown', (e) => { if (e.target.closest('#end')) return; touches.set(e.pointerId, e.clientX); updInput(); });
addEventListener('pointermove', (e) => { if (touches.has(e.pointerId)) { touches.set(e.pointerId, e.clientX); updInput(); } });
const up = (e) => { touches.delete(e.pointerId); updInput(); };
addEventListener('pointerup', up); addEventListener('pointercancel', up);
const KL = { ArrowLeft: 1, KeyA: 1 }, KR = { ArrowRight: 1, KeyD: 1 };
addEventListener('keydown', (e) => { if (KL[e.code]) input.kl = true; if (KR[e.code]) input.kr = true; });
addEventListener('keyup', (e) => { if (KL[e.code]) input.kl = false; if (KR[e.code]) input.kr = false; });
addEventListener('blur', () => { touches.clear(); input.kl = input.kr = input.tl = input.tr = false; });

/* ---------- облегчение по fps ---------- */
const perf = { frames: 0, acc: 0, level: 0 };
function adapt(dt) {

  const fps = perf.frames / perf.acc; perf.frames = 0; perf.acc = 0; window.EL_FPS = fps;
  if (fps < 45 && postOn && !/[?&]fx=1/.test(location.search)) { postOn = false; document.body.classList.remove('post'); perf.level++; }
  else if (tier === 1 && !composer && !perf.tried && fps > 57 && car.state === 'go') { perf.tried = 1; loadPost(); } // хороший телефон — пробуем эффекты
  else if (fps < 40 && dpr > 0.75) { dpr = Math.max(0.75, dpr - 0.25); renderer.setPixelRatio(dpr); perf.level++; }
  else if (fps > 57 && dpr < dprMax) { dpr = Math.min(dprMax, dpr + 0.25); renderer.setPixelRatio(dpr); }
}

/* ---------- камера ---------- */
function fitCam() { camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 74 : 58; camera.updateProjectionMatrix(); }
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitCam(); if (composer) composer.setSize(innerWidth, innerHeight); }); fitCam();
const camPos = new THREE.Vector3(), look = new THREE.Vector3(), lookS = new THREE.Vector3(); let camH = 0;
function camTarget(dt) {

  camH += Math.atan2(Math.sin(car.h - camH), Math.cos(car.h - camH)) * Math.min(1, dt * 3);
  camPos.set(car.x - Math.sin(camH) * back, up, car.z - Math.cos(camH) * back);
  look.set(car.x + Math.sin(camH) * 7, 1.2, car.z + Math.cos(camH) * 7);

function snapCam() { camH = car.h; camTarget(1); camera.position.copy(camPos); lookS.copy(look); }

/* ---------- кадр ---------- */
let last = performance.now(), firstFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const tsec = now / 1000;
  // руль
  const L = input.tl || input.kl, R = input.tr || input.kr;
  const steer = car.state === 'go' && !car.spin ? (L && !R ? 1 : R && !L ? -1 : 0) : 0;
  $('zl').classList.toggle('dn', !!L); $('zr').classList.toggle('dn', !!R);
  if (car.state === 'go' || car.state === 'end') {
    if (car.state === 'go') car.t += dt;
    let spd = Math.hypot(car.vx, car.vz);
    if (car.spin > 0) { car.spin -= dt; car.h += dt * 9; }
    else if (steer) car.h += steer * TURN * dt * (0.55 + 0.45 * Math.min(1, spd / 18));
    const target = car.state === 'end' ? 0 : (car.boost > 0 ? VBOOST : VMAX) * (car.off ? 0.7 : 1) * (car.spin > 0 ? 0.4 : 1);
    spd += (target - spd) * (spd < target ? 0.9 : 1.6) * dt;
    const hx = Math.sin(car.h), hz = Math.cos(car.h);
    let vxn = spd > 0.01 ? car.vx / spd : hx, vzn = spd > 0.01 ? car.vz / spd : hz;
    const grip = steer ? 2.6 : 8, f = 1 - Math.exp(-grip * dt);
    vxn += (hx - vxn) * f; vzn += (hz - vzn) * f; const ln = Math.hypot(vxn, vzn) || 1; vxn /= ln; vzn /= ln;

    const slip = Math.acos(clamp(vxn * hx + vzn * hz, -1, 1));
    // где мы на трассе
    let best = 1e9, bi = car.idx;
    for (let i = Math.max(0, car.idx - 30); i < Math.min(TRACK.length, car.idx + 80); i++) { const p = TRACK[i], d = (p.x - car.x) ** 2 + (p.z - car.z) ** 2; if (d < best) { best = d; bi = i; } }
    car.idx = bi; const tp = TRACK[bi], n = nrm(tp), lat = (car.x - tp.x) * n[0] + (car.z - tp.z) * n[1];
    car.off = Math.abs(lat) > ROAD_W / 2 + 0.4 ? 1 : 0;
    if (Math.abs(lat) > ROAD_W / 2 + 9) { // упёрлась в камни
      const lim = Math.sign(lat) * (ROAD_W / 2 + 9); car.x += (lim - lat) * n[0]; car.z += (lim - lat) * n[1];
      car.h += Math.atan2(Math.sin(tp.a - car.h), Math.cos(tp.a - car.h)) * 0.5; // развернуло вдоль дороги

      if (now - car.bump > 1500) showMsg(OUCH[Math.floor(Math.random() * OUCH.length)], damage('') || dedSay(DED_HIT), '#ff9a7a', 1300, true);
      car.bump = now;
    }

    if (car.state === 'go') {

      if (ORDER === 'seed' && car.drift > 0) { car.seedT += dt; if (car.seedT > 1.5 && car.cargo > 0) { car.seedT = 0; car.cargo--; showMsg('Рассада вылетела!', 'Дед: «Помидорчики мои! Летите, родные!»', '#9aff8a', 1100); } } else car.seedT = 0;
      if (ORDER === 'pies' && !car.cold && car.t > car.pieLimit) { car.cold = true; showMsg('Пирожки остыли!', 'а ведь плавили люльку!', '#ffb07a', 1500); }
      // радио и события зон

      if (!steer && car.drift > 0) {

          car.score += pts; car.boost = Math.min(3, 0.6 + car.drift * 0.8); flash('#5fe0ff', 0.35);
          $('combo').innerHTML = '+' + pts + '<small>' + (Math.random() < 0.5 ? dedSay(DED) : YAY[Math.floor(Math.random() * YAY.length)] + ' · турбо!') + '</small>'; $('combo').classList.add('on'); clearTimeout(frame.ct); frame.ct = setTimeout(() => $('combo').classList.remove('on'), 1100);
        }
        car.drift = 0; car.combo = 0;
      }
      if (car.drift > 0.3) { $('combo').innerHTML = 'ЗАНОС ×' + (1 + Math.min(2, car.drift * 0.6)).toFixed(1) + '<small>' + Math.round(car.combo) + '</small>'; $('combo').classList.add('on'); }
    }
    if (car.boost > 0) car.boost -= dt;
    // предметы
    ITEMS.pots.forEach((p) => { if (p.on && (p.x - car.x) ** 2 + (p.z - car.z) ** 2 < 4.4) { p.on = false; car.pot++; floatText('+1 🥔', p.x, 1.6, p.z); bump($('pot')); if (ORDER === 'potato') bump($('order'), 'bumpc'); for (let q = 0; q < 3; q++) puff(p.x, p.z, 2); } });
    ITEMS.pads.forEach((p) => { if ((p.x - car.x) ** 2 + (p.z - car.z) ** 2 < 5 && car.boost < 1.2) { car.boost = 1.6; flash('#5fe0ff', 0.3); floatText('ТУРБО!', p.x, 1.5, p.z, '#7fe8ff'); } });
    ITEMS.beetles.forEach((b) => {
      const [x, z, a] = at(b.i, Math.sin(tsec * b.sp + b.ph) * (ROAD_W / 2 + 2)); b.x = x; b.z = z; b.a = a + (Math.cos(tsec * b.sp + b.ph) > 0 ? Math.PI / 2 : -Math.PI / 2);
      if (car.state === 'go' && now - b.hit > 2000 && (x - car.x) ** 2 + (z - car.z) ** 2 < 5.5) {
        b.hit = now; car.spin = 0.7; const lost = Math.min(car.pot, 3); car.pot -= lost; car.drift = 0; car.combo = 0;
        const dm = damage(''); showMsg(OUCH[Math.floor(Math.random() * OUCH.length)], dm || (lost ? 'рассыпала ' + lost + ' картошки' : Math.random() < 0.5 ? 'Жук: «Профсоюз этого так не оставит!»' : dedSay(DED_HIT)), '#ff8a6a', 1300, true);
      }
    });
    // пыль
    if ((slip > 0.2 || car.off) && spd > 5 && Math.random() < 0.9) puff(car.x - Math.sin(car.h) * 0.8, car.z - Math.cos(car.h) * 0.8, 1.2);
    if (car.state === 'go' && bi >= TRACK.length - 12) { finish(); showMsg('Доехала!', 'внуки уже ставят самовар на 40 литров', '#ffcf8a', 1800); confetti(); flash('#ffe0a0', 0.4); }
    // интерфейс
    orderHud();
    $('time').textContent = fmt(car.t); $('pot').textContent = car.pot; $('spd').textContent = Math.round(spd * 3.6);
    $('turbo').querySelector('.bar').classList.toggle('hot', car.boost > 0 || car.drift > 0.55);
    $('progi').style.width = (100 * TRACK[bi].s / TOTAL) + '%'; $('turboi').style.width = clamp(car.boost > 0 ? car.boost / 3 * 100 : car.drift / 3 * 100, 0, 100) + '%';
    // бабуля
    babka.position.set(car.x, 0.15 + Math.sin(tsec * 6) * 0.06, car.z); babka.rotation.y = car.h;
    FX.body.rotation.z = -steer * 0.18 * Math.min(1, slip * 3 + 0.3); FX.body.rotation.x = car.boost > 0 ? -0.08 : 0;
    { const d = FX.ded, tz = steer * 0.32 * Math.min(1, slip * 3 + 0.2) + (car.spin > 0 ? Math.sin(tsec * 30) * 0.3 : 0), tx = car.boost > 0 ? -0.35 : 0;
      d.rotation.z += (tz - d.rotation.z) * Math.min(1, dt * 8); d.rotation.x += (tx - d.rotation.x) * Math.min(1, dt * 6); d.position.y = 1.05 + Math.abs(Math.sin(tsec * 7)) * 0.03;
      const fl = car.boost > 0 ? -1.2 - Math.sin(tsec * 40) * 0.3 : -0.1 * Math.min(1, spd / VMAX) - Math.sin(tsec * 18) * 0.08 * (spd / VMAX);
      FX.flaps[0].rotation.x = fl; FX.flaps[1].rotation.x = fl; }
    { const ct = FX.cat, boostK = car.boost > 0 ? 1 : 0; FX.tail.rotation.z = Math.sin(tsec * 3) * 0.6; FX.tail.rotation.x = -0.9 - boostK * 0.6;
      ct.scale.set(1, 1 - boostK * 0.25, 1 + boostK * 0.15); ct.position.y = 1.5 + (car.spin > 0 ? Math.abs(Math.sin(tsec * 20)) * 0.5 : 0); ct.rotation.z = -steer * 0.25; }
    FX.tray.visible = ORDER === 'seed'; if (ORDER === 'seed') FX.tray.children[0].scale.set(1, 1, 1);
    const fk = car.boost > 0 ? 1.8 : 0.6 + spd / VMAX * 0.5; FX.flame.scale.set(1, fk * (0.9 + Math.random() * 0.2), 1); FX.flame.position.z = -1.33 - 0.8 * fk; FX.flame2.scale.set(1, fk, 1); FX.flame2.position.z = -1.33 - 0.5 * fk;
    FX.flame.material.color.set(car.boost > 0 ? '#7fe8ff' : '#ffb04a');
  }
  // предметы: анимация
  let n2 = 0; ITEMS.pots.forEach((p, k) => { if (!p.on) return; pots.setMatrixAt(n2++, mat(p.x, 0.75 + Math.sin(tsec * 3 + k) * 0.15, p.z, 1, 1, 1, tsec * 2 + k, 0.4)); }); pots.count = n2; pots.instanceMatrix.needsUpdate = true;
  ITEMS.beetles.forEach((b, k) => beetles.setMatrixAt(k, mat(b.x, 0.05 + Math.abs(Math.sin(tsec * 12 + k)) * 0.06, b.z, 1, 1, 1, b.a))); beetles.count = ITEMS.beetles.length; beetles.instanceMatrix.needsUpdate = true;
  stepDust(dt); stepTrucks(dt, now); if (MODEL_Q.length) buildModelBand();
  { const zn = car.state === 'go' ? zoneAt(car.idx) : null, storm = zn && zn.kind === 'storm';
    scene.fog.density += ((storm ? 0.02 : 0.0062) - scene.fog.density) * Math.min(1, dt * 1.5);
    $('storm').style.opacity = storm ? 1 : 0; stepMeteors(dt, now, zn && zn.kind === 'meteor');
    if (storm && Math.random() < 0.6) puff(car.x + rnd(-15, 15), car.z + rnd(-15, 15), 6); }
  // видимость полос мира
  for (const g of W.children) if (g.userData.c) { const dx = g.userData.c[0] - car.x, dz = g.userData.c[1] - car.z; g.visible = dx * dx + dz * dz < 420 * 420; }
  camTarget(dt);
  const f = 1 - Math.exp(-dt * 5); camera.position.lerp(camPos, f); lookS.lerp(look, f);
  if (car.boost > 0) camera.position.y += (Math.random() - 0.5) * 0.08;
  if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 1.5); }
  camera.lookAt(lookS); camera.fov += ((camera.aspect < 1 ? 74 : 58) + (car.boost > 0 ? 8 : 0) - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
  skyG.position.copy(camera.position);
  stepTrail(car.boost > 0); motes.position.set(Math.round(car.x / 60) * 60, 0, Math.round(car.z / 60) * 60); stepMotes(dt);
  if (FX.clouds) FX.clouds.rotation.y += dt * 0.004;
  const sfx = $('speedfx'); sfx.style.opacity = car.boost > 0 && car.state === 'go' ? 1 : 0; if (car.boost > 0) sfx.style.transform = 'rotate(' + (Math.random() * 6) + 'deg)';
  if (postOn && composer) { gradePass.uniforms.uTime.value = tsec % 100; gradePass.uniforms.uBoost.value += ((car.boost > 0 ? 1 : 0) - gradePass.uniforms.uBoost.value) * Math.min(1, dt * 5); composer.render(); }

}

/* ---------- старт: первый кадр, заезд сам через ~1 с ---------- */
let firstEver = true; try { firstEver = !localStorage.getItem('bm_seen'); localStorage.setItem('bm_seen', '1'); } catch (e) {}
if (firstEver) ORDER = 'potato';
genTrack(); buildSky(); buildWorld(); placeItems(); resetCar();
snapCam();
requestAnimationFrame(frame);
function afterFirst() {

  if (tier === 2 || /[?&]fx=1/.test(location.search)) setTimeout(loadPost, 300);
  setTimeout(loadModels, 150);
  setTimeout(() => { car.state = 'go'; startMsg(firstEver); }, 1000);
}
window.BM = { get MODELS() { return MODELS; }, TRUCKS, get ZONES() { return ZONES; }, get ORDER() { return ORDER; }, setOrder(o) { ORDER = o; }, get BANK() { return BANK; }, newRun, get postOn() { return postOn; }, car, TRACK, renderer, scene, perf, input, ITEMS, get TOTAL() { return TOTAL; } };
</script>
