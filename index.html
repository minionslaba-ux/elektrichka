  look.set(car.x + Math.sin(camH) * 7, 1.2, car.z + Math.cos(camH) * 7);
}
function snapCam() { camH = car.h; camTarget(1); camera.position.copy(camPos); lookS.copy(look); }

/* ---------- кадр ---------- */
let last = performance.now(), firstFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const tsec = now / 1000;
  // руль
  const L = input.tl || input.kl, R = input.tr || input.kr;
  const steer = car.state === 'go' && !car.spin ? (L && !R ? 1 : R && !L ? -1 : 0) : 0;
  $('zl').classList.toggle('dn', !!L); $('zr').classList.toggle('dn', !!R);
  if (car.state === 'go' || car.state === 'end') {
    if (car.state === 'go') car.t += dt;
    let spd = Math.hypot(car.vx, car.vz);
    if (car.spin > 0) { car.spin -= dt; car.h += dt * 9; }
    else if (steer) car.h += steer * TURN * dt * (0.55 + 0.45 * Math.min(1, spd / 18));
    const target = car.state === 'end' ? 0 : (car.boost > 0 ? VBOOST : VMAX) * (car.off ? 0.7 : 1) * (car.spin > 0 ? 0.4 : 1);
    spd += (target - spd) * (spd < target ? 0.9 : 1.6) * dt;
    const hx = Math.sin(car.h), hz = Math.cos(car.h);
    let vxn = spd > 0.01 ? car.vx / spd : hx, vzn = spd > 0.01 ? car.vz / spd : hz;
    const grip = steer ? 2.6 : 8, f = 1 - Math.exp(-grip * dt);
    vxn += (hx - vxn) * f; vzn += (hz - vzn) * f; const ln = Math.hypot(vxn, vzn) || 1; vxn /= ln; vzn /= ln;
    car.vx = vxn * spd; car.vz = vzn * spd; car.x += car.vx * dt; car.z += car.vz * dt;
    const slip = Math.acos(clamp(vxn * hx + vzn * hz, -1, 1));
    // где мы на трассе
    let best = 1e9, bi = car.idx;
    for (let i = Math.max(0, car.idx - 30); i < Math.min(TRACK.length, car.idx + 80); i++) { const p = TRACK[i], d = (p.x - car.x) ** 2 + (p.z - car.z) ** 2; if (d < best) { best = d; bi = i; } }
    car.idx = bi; const tp = TRACK[bi], n = nrm(tp), lat = (car.x - tp.x) * n[0] + (car.z - tp.z) * n[1];
    car.off = Math.abs(lat) > ROAD_W / 2 + 0.4 ? 1 : 0;
    if (Math.abs(lat) > ROAD_W / 2 + 9) { // упёрлась в камни
      const lim = Math.sign(lat) * (ROAD_W / 2 + 9); car.x += (lim - lat) * n[0]; car.z += (lim - lat) * n[1];
      car.h += Math.atan2(Math.sin(tp.a - car.h), Math.cos(tp.a - car.h)) * 0.5; // развернуло вдоль дороги
      if (now - car.bump > 900) { car.vx *= 0.55; car.vz *= 0.55; car.drift = 0; car.combo = 0; }
      if (now - car.bump > 1500) showMsg(OUCH[Math.floor(Math.random() * OUCH.length)], '', '#ff9a7a', 1100);
      car.bump = now;
    }
    // занос и турбо
    if (car.state === 'go') {
      if (steer && slip > 0.18 && !car.off) { car.drift += dt; car.combo += slip * spd * dt * 4; }
      if (car.off && car.drift > 0) { car.drift = 0; car.combo = 0; showMsg('Ой, в песок!', '', '#ffb07a', 900); }
      if (!steer && car.drift > 0) {
        if (car.drift > 0.55) {
          const mult = 1 + Math.min(2, car.drift * 0.6), pts = Math.round(car.combo * mult);
          car.score += pts; car.boost = Math.min(3, 0.6 + car.drift * 0.8);
          $('combo').innerHTML = '+' + pts + '<small>' + YAY[Math.floor(Math.random() * YAY.length)] + ' · турбо!</small>'; $('combo').classList.add('on'); clearTimeout(frame.ct); frame.ct = setTimeout(() => $('combo').classList.remove('on'), 1100);
        }
        car.drift = 0; car.combo = 0;
      }
      if (car.drift > 0.3) { $('combo').innerHTML = 'ЗАНОС ×' + (1 + Math.min(2, car.drift * 0.6)).toFixed(1) + '<small>' + Math.round(car.combo) + '</small>'; $('combo').classList.add('on'); }
    }
    if (car.boost > 0) car.boost -= dt;
    // предметы
    ITEMS.pots.forEach((p) => { if (p.on && (p.x - car.x) ** 2 + (p.z - car.z) ** 2 < 4.4) { p.on = false; car.pot++; } });
    ITEMS.pads.forEach((p) => { if ((p.x - car.x) ** 2 + (p.z - car.z) ** 2 < 5 && car.boost < 1.2) { car.boost = 1.6; } });
    ITEMS.beetles.forEach((b) => {
      const [x, z, a] = at(b.i, Math.sin(tsec * b.sp + b.ph) * (ROAD_W / 2 + 2)); b.x = x; b.z = z; b.a = a + (Math.cos(tsec * b.sp + b.ph) > 0 ? Math.PI / 2 : -Math.PI / 2);
      if (car.state === 'go' && now - b.hit > 2000 && (x - car.x) ** 2 + (z - car.z) ** 2 < 5.5) {
        b.hit = now; car.spin = 0.7; const lost = Math.min(car.pot, 3); car.pot -= lost; car.drift = 0; car.combo = 0;
        showMsg(OUCH[Math.floor(Math.random() * OUCH.length)], lost ? 'рассыпала ' + lost + ' картошки' : 'жук!', '#ff8a6a', 1300);
      }
    });
    // пыль
    if ((slip > 0.2 || car.off) && spd > 5 && Math.random() < 0.9) puff(car.x - Math.sin(car.h) * 0.8, car.z - Math.cos(car.h) * 0.8, 1.2);
    if (car.state === 'go' && bi >= TRACK.length - 12) { finish(); showMsg('Доехала!', 'внуки уже ставят чайник', '#ffcf8a', 1800); }
    // интерфейс
    $('time').textContent = fmt(car.t); $('pot').textContent = car.pot; $('spd').textContent = Math.round(spd * 3.6);
    $('progi').style.width = (100 * TRACK[bi].s / TOTAL) + '%'; $('turboi').style.width = clamp(car.boost > 0 ? car.boost / 3 * 100 : car.drift / 3 * 100, 0, 100) + '%';
    // бабуля
    babka.position.set(car.x, 0.15 + Math.sin(tsec * 6) * 0.06, car.z); babka.rotation.y = car.h;
    FX.body.rotation.z = -steer * 0.18 * Math.min(1, slip * 3 + 0.3); FX.body.rotation.x = car.boost > 0 ? -0.08 : 0;
    const fk = car.boost > 0 ? 1.8 : 0.6 + spd / VMAX * 0.5; FX.flame.scale.set(1, fk * (0.9 + Math.random() * 0.2), 1); FX.flame.position.z = -1.33 - 0.8 * fk; FX.flame2.scale.set(1, fk, 1); FX.flame2.position.z = -1.33 - 0.5 * fk;
    FX.flame.material.color.set(car.boost > 0 ? '#7fe8ff' : '#ffb04a');
  }
  // предметы: анимация
  let n2 = 0; ITEMS.pots.forEach((p, k) => { if (!p.on) return; pots.setMatrixAt(n2++, mat(p.x, 0.75 + Math.sin(tsec * 3 + k) * 0.15, p.z, 1, 1, 1, tsec * 2 + k, 0.4)); }); pots.count = n2; pots.instanceMatrix.needsUpdate = true;
  ITEMS.beetles.forEach((b, k) => beetles.setMatrixAt(k, mat(b.x, 0.05 + Math.abs(Math.sin(tsec * 12 + k)) * 0.06, b.z, 1, 1, 1, b.a))); beetles.count = ITEMS.beetles.length; beetles.instanceMatrix.needsUpdate = true;
  stepDust(dt);
  // видимость полос мира
  for (const g of W.children) if (g.userData.c) { const dx = g.userData.c[0] - car.x, dz = g.userData.c[1] - car.z; g.visible = dx * dx + dz * dz < 420 * 420; }
  camTarget(dt);
  const f = 1 - Math.exp(-dt * 5); camera.position.lerp(camPos, f); lookS.lerp(look, f);
  if (car.boost > 0) camera.position.y += (Math.random() - 0.5) * 0.08;
  camera.lookAt(lookS); camera.fov += ((camera.aspect < 1 ? 74 : 58) + (car.boost > 0 ? 8 : 0) - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
  skyG.position.copy(camera.position);
  stepTrail(car.boost > 0); motes.position.set(Math.round(car.x / 60) * 60, 0, Math.round(car.z / 60) * 60); stepMotes(dt);
  if (FX.clouds) FX.clouds.rotation.y += dt * 0.004;
  const sfx = $('speedfx'); sfx.style.opacity = car.boost > 0 && car.state === 'go' ? 1 : 0; if (car.boost > 0) sfx.style.transform = 'rotate(' + (Math.random() * 6) + 'deg)';
  if (postOn && composer) { gradePass.uniforms.uTime.value = tsec % 100; gradePass.uniforms.uBoost.value += ((car.boost > 0 ? 1 : 0) - gradePass.uniforms.uBoost.value) * Math.min(1, dt * 5); composer.render(); }
  else renderer.render(scene, camera);
  adapt(dt);
  if (!firstFrame) { firstFrame = performance.now(); window.EL_FIRST = Math.round(firstFrame - T0); afterFirst(); }
}

/* ---------- старт: первый кадр, заезд сам через ~1 с ---------- */
genTrack(); buildSky(); buildWorld(); placeItems();
{ const p = TRACK[3]; Object.assign(car, { x: p.x, z: p.z, h: p.a, idx: 3 }); }
snapCam();
requestAnimationFrame(frame);
function afterFirst() {
  $('boot').classList.add('hide'); document.body.classList.add('play');
  if (tier === 2 || /[?&]fx=1/.test(location.search)) setTimeout(loadPost, 300);
  setTimeout(() => { car.state = 'go'; showMsg('Бабуля, газу!', 'внуки ждут картошку', '#ffcf8a', 1600); hint('Держи палец <b>слева</b> или <b>справа</b> — бабулю заносит. Долгий занос = <b>турбо</b>', 6000); }, 1000);
}
window.BM = { get postOn() { return postOn; }, car, TRACK, renderer, scene, perf, input, ITEMS, get TOTAL() { return TOTAL; } };
</script>
