<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Бабуля на Марсе</title>
<meta name="description" content="Бабуля в турбо-кресле дрифтует по Марсу и везёт внукам картошку.">
<meta name="theme-color" content="#2a1a2e">
<link rel="preload" href="assets/ui/boot.webp" as="image">
<link rel="preload" href="lib/three/three.min.js" as="script">
<style>
:root{--ink:#fff4ea;--dim:#e0c2b0;--hot:#ffb04a;--cyan:#7fe8ff;--glass:rgba(30,14,22,.55);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a2e;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 80% 75% at 50% 45%,transparent 55%,rgba(20,6,12,.55) 100%)}
#boot{position:fixed;inset:0;z-index:20;overflow:hidden;transition:opacity .7s;background:#1a0c1c url(assets/ui/boot.webp) 50% 100%/cover no-repeat}
#boot svg{position:absolute;inset:0;width:100%;height:100%}
#boot .bt{position:absolute;left:0;right:0;top:calc(9vh + env(safe-area-inset-top));text-align:center;padding:0 16px}
#boot h1{margin:0;font-size:clamp(30px,min(9vw,13vh),78px);font-weight:900;line-height:1.02;letter-spacing:-.01em;color:#ffd9a0;background:linear-gradient(#fff3d6 15%,#ffb35c 70%,#f07a3e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:btIn .9s cubic-bezier(.2,.8,.2,1) both}
#boot .bsub{margin:10px 0 0;color:#f2c6b0;font-size:clamp(13px,3.4vw,17px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.85;animation:btIn .9s .15s cubic-bezier(.2,.8,.2,1) both}
#boot .bbot{position:absolute;left:50%;bottom:calc(7vh + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(320px,70vw);text-align:center}
#boot .bbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:0 0 0 1px rgba(255,200,150,.15)}
#boot .bbar i{display:block;height:100%;width:6%;border-radius:6px;background:linear-gradient(90deg,#ff8a4a,#ffd27a);box-shadow:0 0 12px #ffb35c;transition:width .5s ease-out}
#boot .btip{margin:10px 0 0;color:#e8c0b0;font-size:14px;min-height:1.3em;transition:opacity .3s}
#boot.hide{opacity:0;pointer-events:none}#boot.gone{display:none}
@keyframes btIn{from{opacity:0;transform:translateY(14px)}}
@keyframes btTw{50%{opacity:.25}}
@keyframes btSpin{to{transform:rotate(360deg)}}
@keyframes btBob{50%{transform:translateY(-2.5px)}}
@keyframes btDust{0%{opacity:.55;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-150px,-34px) scale(2.6)}}
@keyframes btTail{50%{transform:rotate(-14deg)}}
@keyframes btFlag{50%{transform:skewY(-8deg) scaleX(.9)}}
@keyframes btBlink{0%,60%{opacity:1}70%,100%{opacity:.15}}
#boot .tw{animation:btTw 3s ease-in-out infinite}
#boot .whl{transform-box:fill-box;transform-origin:center;animation:btSpin .9s linear infinite}
#boot .rov{animation:btBob .45s ease-in-out infinite}
#boot .dst{transform-box:fill-box;transform-origin:center;animation:btDust 1.5s ease-out infinite}
#boot .tail{transform-box:fill-box;transform-origin:0% 100%;animation:btTail 2.2s ease-in-out infinite}
#boot .flag{transform-box:fill-box;transform-origin:0% 50%;animation:btFlag 1s ease-in-out infinite}
#boot .blk{animation:btBlink 1.6s infinite}
@media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
.g{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ui{opacity:0;transition:opacity .5s;pointer-events:none}body.play #ui{opacity:1}
#tl{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top));z-index:5;border-radius:12px;padding:7px 12px;font-variant-numeric:tabular-nums}
#tl b{font-size:22px}#tl small{display:block;color:var(--dim);font-size:12px}
#tr{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:5;border-radius:12px;padding:7px 12px;text-align:right;font-variant-numeric:tabular-nums}
#tr b{font-size:22px;color:var(--hot);display:inline-block}#tr small{display:block;color:var(--dim);font-size:12px}
#prog{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);width:min(240px,40vw);height:6px;border-radius:3px;background:rgba(255,255,255,.15);z-index:5;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hot),#ffe08a)}
#turbo{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(220px,46vw);z-index:5;text-align:center}
#turbo .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}#turbo .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#fff)}
#turbo small{display:block;margin-top:5px;font-size:11px;letter-spacing:.14em;color:var(--dim)}
#spd{display:block;font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000;margin-bottom:4px}
#spd::after{content:" км/ч";font:700 12px system-ui,sans-serif;letter-spacing:0;opacity:.65;text-shadow:none}
#combo{position:fixed;left:0;right:0;top:24%;text-align:center;z-index:6;pointer-events:none;font-weight:900;font-size:clamp(22px,6vw,40px);color:var(--cyan);text-shadow:0 0 20px rgba(127,232,255,.6),0 3px 12px #000;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}#combo small{display:block;font-size:15px;font-weight:600;color:var(--ink)}
#msg{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:clamp(28px,7vw,50px);font-weight:900;pointer-events:none;z-index:6;opacity:0;transform:scale(.92);transition:opacity .2s,transform .2s;text-shadow:0 0 24px currentColor,0 3px 14px #000}
#msg.on{opacity:1;transform:none}#msg small{display:block;font-size:16px;font-weight:600;color:var(--ink);margin-top:6px}
#hint{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100vw - 32px));text-align:center;z-index:6;opacity:0;transition:opacity .4s;pointer-events:none}
#hint.on{opacity:1}#hint span{display:inline-block;border-radius:12px;padding:9px 14px;font-size:15px;line-height:1.35}
.zone{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.75;transition:transform .08s,box-shadow .15s}
#brk{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:6;font:900 14px system-ui,sans-serif;letter-spacing:.1em;color:#ff7a5a;font-size:18px;opacity:0;transition:opacity .15s;pointer-events:none;text-shadow:0 0 10px rgba(255,90,60,.7)}#brk.on{opacity:1}body.walk #brk,body.farm #brk,body.def #brk,body.fish #brk{display:none}
#zl{left:16px}#zr{right:16px}.zone.dn{transform:scale(.92);box-shadow:0 0 0 2px var(--cyan),0 0 24px rgba(127,232,255,.5);opacity:1}
#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,6,12,.55);z-index:10;padding:16px}
#end.on{display:flex}#end .card{width:min(400px,100%);border-radius:18px;padding:22px;text-align:center}
#end h2{margin:0;font-size:24px}#end .sub{color:var(--dim);font-size:13px;margin-top:3px}
#end .stars{font-size:40px;color:var(--hot);letter-spacing:6px;margin:8px 0;text-shadow:0 0 18px rgba(255,176,74,.5)}
#end table{width:100%;border-collapse:collapse;margin:6px 0 16px;font-size:15px}#end td{padding:6px 0;border-bottom:1px solid var(--line)}#end td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#end button{width:100%;padding:15px;border-radius:14px;border:0;background:var(--hot);color:#2a1406;font:900 18px system-ui,sans-serif;cursor:pointer}
#speedfx{position:fixed;inset:-20%;pointer-events:none;z-index:3;opacity:0;transition:opacity .25s;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,0) 0deg 5deg,rgba(200,240,255,.13) 5deg 5.5deg);
  -webkit-mask:radial-gradient(circle at 50% 50%,transparent 32%,#000 70%);mask:radial-gradient(circle at 50% 50%,transparent 32%,#000 70%)}
body.post #vig{display:none}
#order{position:fixed;left:50%;top:calc(32px + env(safe-area-inset-top));transform:translateX(-50%);z-index:5;border-radius:12px;padding:5px 12px;font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
body:not(.walk):not(.farm):not(.def):not(.fish) #order{max-width:calc(100vw - 230px);overflow:hidden;text-overflow:ellipsis}
#order.bad{color:#ff8a6a}
#radio{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);width:min(460px,calc(100vw - 32px));text-align:center;z-index:5;opacity:0;transition:opacity .4s;pointer-events:none}
#radio.on{opacity:1}#radio span{display:inline-block;border-radius:10px;padding:6px 12px;font-size:13px;line-height:1.3;color:var(--ink)}#radio b{color:var(--cyan)}
#storm{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse at 50% 60%,rgba(220,120,70,.25),rgba(170,80,40,.7))}
#end .card{max-height:calc(100vh - 32px);overflow:auto}
#end .bank{margin:4px 0 14px;text-align:left}#end .bank .bl{font-size:12px;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
#end .bank .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}#end .bank .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fe8ff,#ffe08a);transition:width 1.2s ease-out}
#end .bank small{display:block;margin-top:5px;font-size:13px;color:var(--ink)}
#end .lab{font-size:12px;letter-spacing:.1em;color:var(--dim);text-align:left;margin:4px 0 8px}
#orders{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
#end .ord{width:auto;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:12px;padding:9px 8px;text-align:left;cursor:pointer;font:600 13px system-ui,sans-serif;line-height:1.25}
.ord b{display:block;font-size:14px;margin-bottom:3px}.ord small{color:var(--dim);font-size:11.5px;font-weight:500}
#end .ord.story{grid-column:1/-1;background:linear-gradient(90deg,rgba(90,110,80,.35),rgba(255,176,74,.12))}
#end .ord.on{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 16px rgba(255,176,74,.25);background:rgba(255,176,74,.08)}
/* ---------- моушн-графика ---------- */
@keyframes pop{0%{transform:scale(1.7) rotate(-5deg);opacity:0}55%{transform:scale(.93) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shakeX{0%,100%{transform:translateX(0)}15%{transform:translateX(-14px) rotate(-2deg)}35%{transform:translateX(12px) rotate(2deg)}55%{transform:translateX(-8px)}75%{transform:translateX(5px)}}
@keyframes letter{0%{transform:translateY(46px) scale(.3) rotate(-12deg);opacity:0}70%{transform:translateY(-8px) scale(1.12);opacity:1}100%{transform:none;opacity:1}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes bumpC{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
@keyframes shakeC{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 9px))}40%{transform:translateX(calc(-50% + 8px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{opacity:1;transform:translate(-50%,-12px) scale(1.2)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
@keyframes stamp{0%{transform:scale(3.2) rotate(-20deg);opacity:0}60%{transform:scale(.82) rotate(4deg);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes slideCard{0%{transform:translateX(-120vw) skewX(-12deg)}16%{transform:translateX(0) skewX(-12deg)}84%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(120vw) skewX(-12deg)}}
@keyframes stripes{to{background-position:56px 0}}
@keyframes flash{0%{opacity:var(--fo,.7)}100%{opacity:0}}
@keyframes cardIn{0%{transform:translateY(60px) scale(.88);opacity:0}100%{transform:none;opacity:1}}
@keyframes warnIn{0%{transform:translateY(-120%) skewY(-3deg)}15%{transform:translateY(0) skewY(-3deg)}85%{transform:translateY(0) skewY(-3deg)}100%{transform:translateY(-120%) skewY(-3deg)}}
@keyframes conf{0%{transform:translate(0,-10vh) rotate(0);opacity:1}100%{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:1}}
@keyframes glowP{0%,100%{box-shadow:0 0 6px rgba(127,232,255,.4)}50%{box-shadow:0 0 22px rgba(127,232,255,.95)}}
#msg.on .ttl{display:inline-block;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
#msg .ch{display:inline-block;animation:letter .5s cubic-bezier(.2,1.5,.4,1) both;white-space:pre}
#msg.bad.on{animation:shakeX .45s both}
.bump{animation:bump .35s ease-out}#order.bumpc{animation:bumpC .35s ease-out}#order.shk{animation:shakeC .4s both}
#combo.on{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
#fl{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
#fl .f{position:absolute;font-weight:900;font-size:22px;color:#ffd06a;text-shadow:0 0 12px rgba(255,190,90,.8),0 2px 6px #000;animation:floatUp .9s ease-out both;white-space:nowrap}
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0}
#flash.go{animation:flash .5s ease-out both}
#intro{position:fixed;left:0;right:0;top:30%;z-index:7;pointer-events:none;display:none}
#intro.on{display:block}
#intro .in{margin:0 auto;width:min(520px,88vw);padding:14px 26px;background:linear-gradient(90deg,rgba(255,176,74,.95),rgba(255,106,216,.92));color:#2a0e1e;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.45);animation:slideCard 2.2s cubic-bezier(.7,0,.2,1) both}
#intro small{display:block;font-weight:900;letter-spacing:.3em;font-size:12px;opacity:.75}
#intro b{display:block;font-size:clamp(24px,6vw,36px);font-weight:900;line-height:1.1;margin:2px 0}
#intro span{font-size:14px;font-weight:700}
#warn{position:fixed;left:0;right:0;top:calc(110px + env(safe-area-inset-top));z-index:7;pointer-events:none;display:none;text-align:center}
#warn.on{display:block}
#warn .in{display:inline-block;padding:10px 22px;font-weight:900;font-size:clamp(18px,4.6vw,26px);letter-spacing:.06em;color:#1a0a06;border-radius:6px;
  background:repeating-linear-gradient(45deg,#ffcf3a 0 20px,#ff8a3a 20px 40px);background-size:56px 100%;animation:warnIn 2.4s cubic-bezier(.7,0,.2,1) both,stripes .5s linear infinite;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#warn .in i{font-style:normal;background:rgba(255,255,255,.85);padding:2px 10px;border-radius:4px}
#end.on .card{animation:cardIn .5s cubic-bezier(.2,1.3,.4,1) both}
#end .stars span{display:inline-block;opacity:0}
#end.on .stars span{animation:stamp .45s cubic-bezier(.2,1.5,.4,1) both}
#end h2 .ch{display:inline-block;animation:letter .45s cubic-bezier(.2,1.5,.4,1) both;white-space:pre}
#turbo .bar.hot{animation:glowP .6s ease-in-out infinite}
.cf{position:fixed;top:0;width:9px;height:14px;z-index:11;pointer-events:none;border-radius:2px;animation:conf linear both}
#radio span .cur{display:inline-block;width:7px;height:13px;background:var(--cyan);margin-left:2px;vertical-align:-2px;animation:flash .6s steps(2) infinite}
/* ---------- рыбалка ---------- */
#fishHud{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
body.fish #fishHud{display:flex}body.fish #zl,body.fish #zr,body.fish #turbo,body.fish #prog,body.fish #tr{display:none}body.farm #fishHud{display:none}
#fishHud .tens{position:relative;width:min(320px,76vw);height:18px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .2s}
#fishHud.reel .tens{opacity:1}
#fishHud .tens .ok{position:absolute;top:0;bottom:0;left:25%;width:55%;background:rgba(120,230,150,.28);border-left:2px solid #7be39a;border-right:2px solid #7be39a}
#fishHud .tens .bad{position:absolute;top:0;bottom:0;left:85%;right:0;background:rgba(255,80,60,.3)}
#fishHud .tens .nd{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff}
#fishHud .dist{width:min(320px,76vw);height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .2s}#fishHud.reel .dist{opacity:1}
#fishHud .dist i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fe8ff,#fff)}
#fishHud .lbl{font-weight:800;font-size:15px;letter-spacing:.06em;text-shadow:0 2px 8px #000;text-align:center;min-height:20px}
#fishHud .big{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;pointer-events:none;transition:transform .08s}
#fishHud .big.dn{transform:scale(.92);box-shadow:0 0 0 3px var(--cyan),0 0 30px rgba(127,232,255,.5)}
#fishCard{position:fixed;left:16px;right:16px;margin:0 auto;max-width:340px;top:22%;z-index:8;display:none;text-align:center;border-radius:16px;padding:14px 22px;pointer-events:none}
#fishCard.on{display:block;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}#fishCard b{display:block;font-size:24px;margin:4px 0}#fishCard .e{font-size:46px}#fishCard small{color:var(--dim);font-size:14px}#fishCard .new{color:var(--hot);font-weight:900;letter-spacing:.1em;font-size:12px}
/* ---------- ферма ---------- */
body.farm #zl,body.farm #zr,body.farm #turbo,body.farm #prog,body.farm #tr,body.farm #tl{display:none}
#farmHud{display:none}body.farm #farmHud{display:block}
#inv{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;border-radius:12px;padding:6px 14px;font-weight:800;font-size:16px;white-space:nowrap;pointer-events:none}
#farmBack{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;border:0;border-radius:14px;padding:14px 22px;background:var(--hot);color:#2a1406;font:900 16px system-ui,sans-serif;cursor:pointer}
#seeds{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));margin:0 auto;max-width:440px;z-index:8;display:none;border-radius:16px;padding:12px}
body.farm.seedson #inv{display:none}#seeds.on{display:block;animation:pop .3s cubic-bezier(.2,1.5,.4,1) both}
#seeds .t{font-size:12px;letter-spacing:.12em;color:var(--dim);margin:0 2px 8px}
#seeds .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#seeds button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:12px;padding:8px 2px;font:700 12px system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#seeds button i{font-size:26px;font-style:normal}#seeds button small{color:var(--dim);font-weight:500;font-size:11px}
/* ---------- карта колонии ---------- */
#map{position:fixed;inset:0;z-index:12;display:none;background:radial-gradient(ellipse at 50% 40%,#b8603e 0%,#8a4430 55%,#4a2230 100%);overflow:hidden}
#map.on{display:block;animation:cardIn .4s ease-out both}
#map svg{position:absolute;inset:0;width:100%;height:100%}
#map .hdr{position:absolute;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:2;border-radius:14px;padding:10px 14px}
#map .hdr b{font-size:18px}#map .hdr small{color:var(--dim);font-size:12px}
